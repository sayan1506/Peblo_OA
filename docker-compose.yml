services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: peblo
      POSTGRES_USER: peblo
      POSTGRES_PASSWORD: peblo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo -d peblo"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    env_file: .env
    environment:
      # Overrides .env's localhost:5433 (correct for host-side dev, meaningless
      # inside this container) with the compose-network address and the
      # container-internal Postgres port.
      DATABASE_URL: postgresql+psycopg2://peblo:peblo@db:5432/peblo
      SEED_ON_START: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8010"
    volumes:
      - api-storage:/app/storage

  cms:
    build:
      context: ./cms
      args:
        VITE_API_URL: http://localhost:8010
    depends_on:
      - api
    ports:
      - "5173:80"

  viewer:
    build:
      context: ./viewer
      args:
        VITE_API_URL: http://localhost:8010
    depends_on:
      - api
    ports:
      - "5174:80"

volumes:
  pgdata:
  api-storage:
